name: Java automation tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    name: UI (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install Microsoft Edge
        if: matrix.browser == 'edge'
        uses: browser-actions/setup-edge@v1
        with:
          edge-version: stable
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw
      - name: Run browser coverage
        run: ./mvnw test -Dgroups=ui -Dbrowser=${{ matrix.browser }} -Dheadless=true
      - name: Upload UI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-${{ matrix.browser }}-diagnostics
          if-no-files-found: ignore
          path: |
            target/allure-results
            target/surefire-reports
            artifacts/logs
            artifacts/screenshots

  api-and-sqlite:
    name: API and SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - name: Run API tests
        run: ./mvnw test -Dgroups=api
      - name: Run isolated SQLite tests
        run: ./mvnw test -Dgroups=db
      - name: Upload service-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-sqlite-diagnostics
          if-no-files-found: ignore
          path: |
            target/allure-results
            target/surefire-reports
            artifacts/logs

  classicmodels:
    name: External ClassicModels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - name: Run read-only external validation
        env:
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: ./mvnw test -Dgroups=external
      - name: Upload external-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: classicmodels-diagnostics
          if-no-files-found: ignore
          path: |
            target/allure-results
            target/surefire-reports
            artifacts/logs
